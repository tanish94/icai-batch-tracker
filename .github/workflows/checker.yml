name: ICAI Indore Batch Check

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Send the full batch list to Telegram even if nothing changed'
        type: boolean
        default: true

permissions:
  contents: write   # needed to save state.json back to the repo

jobs:
  check-batches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run ICAI Batch Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: python tracker.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug_*.png
            debug_*.html
          if-no-files-found: ignore

      - name: Save state
        if: always()
        run: |
          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            git diff --staged --quiet || (git commit -m "update batch state" && git push)
          fi
